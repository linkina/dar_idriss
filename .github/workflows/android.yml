name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire le jeu
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../dar-idriss.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dar-idriss-apk
          path: dar-idriss.apk

      # Always-current download link: the "apk-test" release holds the latest APK.
      - name: Publier dans la release apk-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-test --yes --cleanup-tag || true
          gh release create apk-test dar-idriss.apk --title "Dar Idriss : APK de test" --notes "Version de test construite depuis ${GITHUB_SHA::7}. Installe dar-idriss.apk sur un téléphone Android." --prerelease
